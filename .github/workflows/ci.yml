name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  minimum-node:
    name: Minimum Node 22 (full verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Install official-schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run full release check (includes pnpm verify and browser matrix)
        run: pnpm release:check
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  current-node:
    name: Node ${{ matrix.node }} (compatibility)
    strategy:
      matrix:
        node: [24, 26.13.1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
