packages:
  - "packages/*"
  - "examples/*"

# Reviewed transitive versions for the formatter and Vite toolchain.
overrides:
  "tinypool@2.1.0": "2.1.2"
  "source-map-js@1.2.1": "1.2.2"
  "picomatch": "4.0.7"

# Allow this reviewed security patch before the configured seven-day delay.
minimumReleaseAgeExclude:
  - "source-map-js@1.2.2"

  # Exact lint backend and compatible Oxlint cohort for the requested tsrs trial.
  - "tsrs@0.25.0-ts7.1.0-beta"
  - "oxlint@1.94.0"
  - "@oxlint/binding-darwin-x64@1.94.0"
  - "@oxlint/binding-freebsd-x64@1.94.0"
  - "@oxlint/binding-darwin-arm64@1.94.0"
  - "@oxlint/binding-android-arm64@1.94.0"
  - "@oxlint/binding-linux-x64-gnu@1.94.0"
  - "@oxlint/binding-linux-x64-musl@1.94.0"
  - "@oxlint/binding-win32-x64-msvc@1.94.0"
  - "@oxlint/binding-linux-arm64-gnu@1.94.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.94.0"
  - "@oxlint/binding-linux-s390x-gnu@1.94.0"
  - "@oxlint/binding-win32-ia32-msvc@1.94.0"
  - "@oxlint/binding-android-arm-eabi@1.94.0"
  - "@oxlint/binding-linux-arm64-musl@1.94.0"
  - "@oxlint/binding-win32-arm64-msvc@1.94.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.94.0"
  - "@oxlint/binding-openharmony-arm64@1.94.0"
  - "@oxlint/binding-linux-riscv64-musl@1.94.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.94.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.94.0"
  - "@tsrs/darwin-arm64@0.25.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.25.0-ts7.1.0-beta"
  - "@tsrs/win32-arm64@0.25.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.25.0-ts7.1.0-beta"

# Accepted development-tool risk; remove when patched. See docs/dependency-security-pins.md.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
